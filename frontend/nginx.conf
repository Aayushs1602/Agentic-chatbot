server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Proxy the API from the same origin so the anonymous user cookie is
    # first-party and no CORS preflight is involved in production.
    location ~ ^/(api|readyz|healthz) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE requires all of these: without them nginx buffers the stream and
        # the answer arrives in one lump at the end instead of token by token.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
